# Configuración automática de despliegue para Render (render.com)
services:
  - type: web
    name: project-date
    env: static
    buildCommand: ""
    staticPublishPath: ./
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
